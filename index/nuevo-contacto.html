<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Contacto</title>
    <link rel="stylesheet" href="../styles/nuevo-contacto.css">
</head>

<body>
    <div class="form-container">
        <h1>Nuevo Contacto</h1>
        <form id="contactForm">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" required>
            </div>
            <div class="form-group">
                <label for="correo">Correo:</label>
                <input type="email" id="correo" name="correo" required>
            </div>
            <div class="form-group">
                <label for="cumpleaños">Fecha de Nacimiento:</label>
                <input type="date" id="cumpleaños" name="cumpleaños" required>
            </div>
            <div class="form-group">
                <label for="empresa">Empresa:</label>
                <input type="text" id="empresa" name="empresa" required>
            </div>
            <button type="submit">Guardar Contacto</button>
            <!-- Botón para regresar a la página anterior-->
            <button type="button" onclick="history.back()" class="back-button">
                <svg width="18px" height="18px" viewBox="-3.2 -3.2 38.40 38.40" version="1.1"
                    xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" fill="#ffffff"
                    stroke="#ffffff" stroke-width="2.2079999999999997">
                    <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                    <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round" stroke="#CCCCCC"
                        stroke-width="0.384">
                        <g id="icomoon-ignore"> </g>
                        <path
                            d="M5.333 12.533v17.707h24.533v-24.533h-19.2v-4l-10.667 7.253 5.333 3.573zM9.6 5.76c0 0 0 0.053 0 0v0 1.067h1.013c0 0 0 0 0.053 0 0 0 0.053 0 0.053 0h0.053c5.013 0 8.32 2.773 9.76 6.293-3.040-2.56-6.987-2.88-8.907-2.88-0.053 0-0.053 0-0.107 0h-1.92v1.067c0 0 0 0 0 0v2.827l-7.68-5.173 7.68-5.227v2.027zM6.4 13.28l4.267 2.88v-4.8c0.213 0 0.533-0.053 0.96-0.053 2.667 0 8.373 0.693 10.773 6.133 0-4.48-2.293-8.693-6.56-10.613h12.96v22.4h-22.4v-15.947z"
                            fill="#ffffff"> </path>
                    </g>
                    <g id="SVGRepo_iconCarrier">
                        <g id="icomoon-ignore"> </g>
                        <path
                            d="M5.333 12.533v17.707h24.533v-24.533h-19.2v-4l-10.667 7.253 5.333 3.573zM9.6 5.76c0 0 0 0.053 0 0v0 1.067h1.013c0 0 0 0 0.053 0 0 0 0.053 0 0.053 0h0.053c5.013 0 8.32 2.773 9.76 6.293-3.040-2.56-6.987-2.88-8.907-2.88-0.053 0-0.053 0-0.107 0h-1.92v1.067c0 0 0 0 0 0v2.827l-7.68-5.173 7.68-5.227v2.027zM6.4 13.28l4.267 2.88v-4.8c0.213 0 0.533-0.053 0.96-0.053 2.667 0 8.373 0.693 10.773 6.133 0-4.48-2.293-8.693-6.56-10.613h12.96v22.4h-22.4v-15.947z"
                            fill="#ffffff"> </path>
                    </g>
                </svg>
                Volver</button>
        </form>
    </div>
</body>

</html>
